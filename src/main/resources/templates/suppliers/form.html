
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Form</title>
</head>
<body>

<h1>Inventory Management System</h1>

<h2 th:text="${supplier.id == null ? 'Add New Supplier' : 'Edit Supplier'}">
    Supplier Form
</h2>

<form th:action="${supplier.id == null}
            ? @{/suppliers}
            : @{/suppliers/update/{id}(id=${supplier.id})}"
      th:object="${supplier}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <label for="name">Supplier Name:</label>
    <input type="text"
           id="name"
           th:field="*{name}"
           placeholder="Enter supplier name">

    <p th:if="${#fields.hasErrors('name')}"
       th:errors="*{name}" style="color:red;"></p>

    <br>

    <label for="contactPerson">Contact Person:</label>
    <input type="text"
           id="contactPerson"
           th:field="*{contactPerson}"
           placeholder="Enter contact person">

    <p th:if="${#fields.hasErrors('contactPerson')}"
       th:errors="*{contactPerson}" style="color:red;"></p>

    <br>

    <label for="email">Email:</label>
    <input type="email"
           id="email"
           th:field="*{email}"
           placeholder="Enter email address">

    <p th:if="${#fields.hasErrors('email')}"
       th:errors="*{email}" style="color:red;"></p>

    <br>

    <label for="phone">Phone:</label>
    <input type="text"
           id="phone"
           th:field="*{phone}"
           placeholder="Enter phone number">

    <p th:if="${#fields.hasErrors('phone')}"
       th:errors="*{phone}" style="color:red;"></p>

    <br>

    <label for="address">Address:</label>
    <textarea id="address"
              th:field="*{address}"
              placeholder="Enter supplier address">
        </textarea>

    <p th:if="${#fields.hasErrors('address')}"
       th:errors="*{address}" style="color:red;"></p>

    <br><br>

    <button type="submit">Save Supplier</button>

    <a th:href="@{/suppliers}">Cancel</a>

</form>

</body>
</html>
