
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Suppliers</title>
</head>
<body>

<h1>Inventory Management System</h1>

<h2>Manage Suppliers</h2>

<a th:href="@{/suppliers/new}">Add New Supplier</a>

<br><br>

<table border="1" cellpadding="10">
    <thead>
    <tr>
        <th>ID</th>
        <th>Supplier Name</th>
        <th>Contact Person</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="supplier : ${suppliers}">
        <td th:text="${supplier.id}"></td>
        <td th:text="${supplier.name}"></td>
        <td th:text="${supplier.contactPerson}"></td>
        <td th:text="${supplier.email}"></td>
        <td th:text="${supplier.phone}"></td>
        <td th:text="${supplier.address}"></td>

        <td>
            <a th:href="@{/suppliers/edit/{id}(id=${supplier.id})}">
                Edit
            </a>

            <form th:action="@{/suppliers/delete/{id}(id=${supplier.id})}"
                  method="post"
                  style="display:inline;">

                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(suppliers)}">
        <td colspan="7">No suppliers found.</td>
    </tr>
    </tbody>
</table>

<br>

<a th:href="@{/products}">Manage Products</a>

</body>
</html>
