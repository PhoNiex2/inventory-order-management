
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form</title>
</head>
<body>

<h1>Inventory Management System</h1>

<h2 th:text="${product.id == null ? 'Add New Product' : 'Edit Product'}">
    Product Form
</h2>

<form th:action="${product.id == null}
            ? @{/products}
            : @{/products/update/{id}(id=${product.id})}"
      th:object="${product}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <label for="name">Product Name:</label>
    <input type="text"
           id="name"
           th:field="*{name}"
           placeholder="Enter product name">

    <p th:if="${#fields.hasErrors('name')}"
       th:errors="*{name}" style="color:red;"></p>

    <br>

    <label for="sku">SKU:</label>
    <input type="text"
           id="sku"
           th:field="*{sku}"
           placeholder="Enter product SKU">

    <p th:if="${#fields.hasErrors('sku')}"
       th:errors="*{sku}" style="color:red;"></p>

    <br>

    <label for="description">Description:</label>
    <textarea id="description"
              th:field="*{description}"
              placeholder="Enter product description">
        </textarea>

    <p th:if="${#fields.hasErrors('description')}"
       th:errors="*{description}" style="color:red;"></p>

    <br>

    <label for="price">Price (€):</label>
    <input type="number"
           id="price"
           th:field="*{price}"
           step="0.01"
           min="0.01"
           placeholder="Enter price">

    <p th:if="${#fields.hasErrors('price')}"
       th:errors="*{price}" style="color:red;"></p>

    <br>

    <label for="quantity">Quantity:</label>
    <input type="number"
           id="quantity"
           th:field="*{quantity}"
           min="0"
           placeholder="Enter quantity">

    <p th:if="${#fields.hasErrors('quantity')}"
       th:errors="*{quantity}" style="color:red;"></p>

    <br>

    <label for="reorderLevel">Reorder Level:</label>
    <input type="number"
           id="reorderLevel"
           th:field="*{reorderLevel}"
           min="0"
           placeholder="Enter reorder level">

    <p th:if="${#fields.hasErrors('reorderLevel')}"
       th:errors="*{reorderLevel}" style="color:red;"></p>

    <br>

    <label for="category">Category:</label>

    <select id="category" th:field="*{category.id}">
        <option value="">Select a category</option>

        <option th:each="category : ${categories}"
                th:value="${category.id}"
                th:text="${category.name}">
        </option>
    </select>

    <p th:if="${#fields.hasErrors('category')}"
       th:errors="*{category}" style="color:red;"></p>

    <br><br>

    <button type="submit">Save Product</button>

    <a th:href="@{/products}">Cancel</a>

</form>

</body>
</html>
